# Free hackathon demo: Tiger stores accounts/context; local agent files are ephemeral.
services:
  - type: web
    name: civitas-relay
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev --ignore-scripts && npm run build:host
    startCommand: npm run start:host
    healthCheckPath: /readyz
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: RELAY_STORAGE
        value: postgres
      - key: RELAY_ANALYTICS_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CA_PEM
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CIVITAS_MODEL_PROVIDER
        value: openai
      - key: CIVITAS_MODEL
        value: gpt-4.1-mini
      - key: CIVITAS_SPEND_LIMIT_USD
        value: "15"
      - key: CIVITAS_RUN_LIMIT_USD
        value: "1"
      # Populate with approved account IDs after signup. Empty disables hosted
      # model controls; native Claude/Codex linking still works for all members.
      - key: CIVITAS_HOSTED_AGENT_OWNER_IDS
        value: ""
      - key: CIVITAS_PUBLISHER_TOKEN
        generateValue: true
      - key: CIVITAS_RECEIVER_TOKEN
        generateValue: true
